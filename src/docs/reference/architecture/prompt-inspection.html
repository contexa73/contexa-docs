<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{i18n.title.promptInspection}} | Contexa Docs</title>
  <meta name="description" content="How Contexa versions its security decision prompt as bundles: manifests, the bundle selector, registry states, the release gate, shadow runs, canaries, rollback, and the prompt inspector that checks sealed prompts against their sources.">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/code.css">
  <link rel="stylesheet" href="/assets/css/docs.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <style>
    /* ── Callouts ── */
    .callout-info {
      background: var(--brand-primary-light);
      border-left: 3px solid var(--brand-primary);
      padding: var(--space-4) var(--space-5);
      border-radius: var(--radius-md);
      margin: var(--space-5) 0;
      font-size: var(--text-sm);
      line-height: var(--leading-relaxed);
      color: var(--text-primary);
    }

    /* ── Six-stage pipeline (refined) ── */
    .pipeline-six {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: var(--space-2);
      margin: var(--space-8) 0;
      position: relative;
    }
    @media (max-width: 900px) {
      .pipeline-six { grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    }
    @media (max-width: 520px) {
      .pipeline-six { grid-template-columns: repeat(2, 1fr); }
    }
    .pipeline-stage {
      position: relative;
      padding: var(--space-4) var(--space-3) var(--space-3);
      text-align: center;
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
    }
    .pipeline-stage:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-brand);
    }
    .pipeline-stage-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: var(--brand-gradient);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: var(--space-2);
      box-shadow: var(--shadow-brand);
    }
    .pipeline-stage-name {
      font-weight: 700;
      font-size: var(--text-sm);
      color: var(--text-primary);
      letter-spacing: var(--tracking-tight);
      margin-bottom: 2px;
    }
    .pipeline-stage-pkg {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--brand-primary);
      opacity: 0.8;
      margin-bottom: var(--space-2);
      word-break: break-all;
      line-height: var(--leading-snug);
    }
    .pipeline-stage-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: var(--leading-relaxed);
    }

    /* ── Section builder grid ── */
    .builder-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-3);
      margin: var(--space-5) 0;
    }
    @media (max-width: 900px) {
      .builder-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .builder-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .builder-grid { grid-template-columns: 1fr; }
    }
    .builder-tile {
      position: relative;
      padding: var(--space-4);
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .builder-tile:hover {
      transform: translateY(-1px);
      border-color: var(--border-brand);
    }
    .builder-tile--system {
      background: var(--brand-primary-light);
      border-color: var(--border-brand);
    }
    .builder-tile-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      color: #fff;
      margin-bottom: var(--space-2);
      letter-spacing: 0.08em;
    }
    .builder-tile-tag--sys { background: var(--brand-primary); }
    .builder-tile-tag--usr { background: var(--brand-secondary); }
    .builder-tile-name {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-1);
      line-height: var(--leading-snug);
    }
    .builder-tile-desc {
      font-size: 11px;
      color: var(--text-secondary);
      line-height: var(--leading-relaxed);
    }

    /* ── Calibration list ── */
    .calib-list {
      list-style: none;
      padding: 0;
      margin: var(--space-5) 0;
    }
    .calib-list li {
      padding: var(--space-3) var(--space-4);
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-2);
      font-size: var(--text-sm);
      line-height: var(--leading-relaxed);
      color: var(--text-secondary);
      border-left: 3px solid var(--border-medium);
      transition: border-color var(--transition-fast);
    }
    .calib-list li:hover { border-left-color: var(--brand-primary); }
    .calib-list li strong {
      color: var(--text-primary);
      font-weight: 700;
    }
  </style>
</head>
<body>
  {{header}}
  <main class="site-main">
    <div class="docs-layout">
      {{sidebar}}
      <div class="docs-content">
        <div class="docs-content-inner">
          {{content}}
        </div>
      </div>
    </div>
  </main>
  {{footer}}
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/sidebar.js"></script>
  <script src="/assets/js/code-highlight.js"></script>
  <script src="/assets/js/docs-search.js"></script>
  <script src="/assets/js/docs-toc.js"></script>
</body></html>
